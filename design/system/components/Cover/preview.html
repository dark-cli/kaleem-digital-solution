<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kaleem</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; background:var(--paper); }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .board { fill:var(--board); }
  .butter { fill:var(--butter); } .mint { fill:var(--mint); } .peach { fill:var(--peach); } .lilac { fill:var(--lilac); }
  .pen { stroke:var(--ink); stroke-width:2; }
  .line { fill:var(--ink); }
  .star { fill:var(--chalk); } .star-b { fill:var(--logo-block); } .star-s { fill:var(--sky); }
  .words { position:absolute; left:var(--space-7); bottom:var(--space-7); max-width:440px; }
  .name { margin:0; font-family:var(--font-serif); font-size:120px; line-height:.92; font-weight:700; letter-spacing:-2px; color:var(--ink); }
  .tag { margin:var(--space-4) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      board 304×160 night-sky slab bled off the top-right · butter 160×176 (the Jailbreak, the brand's signature) · mint 112×80 · peach 112×120 bled off the right · lilac 136×24 band
  arrangement pastel cards overlapping the sky slab like notebook cards on a desk at night; each card carries the sketch outline (sketch-line 2px ink) and its second pen line offset by sketch-offset 4px
  pattern     a literal motif, the night sky that frames every kaleem.dev page: 14 stars (chalk, logo-block, sky dots) scattered in the board slab only
  scales      sides in space-7 (32px) and space-6 (24px) multiples; gaps space-6; offset sketch-offset 4px; corners rx 6 approximating sketch-radius
-->
<rect class="board" x="176" y="-24" width="328" height="184" rx="6"/>
<g>
  <circle class="star" cx="216" cy="20" r="2"/><circle class="star-b" cx="262" cy="44" r="2.5"/><circle class="star" cx="318" cy="16" r="1.5"/>
  <circle class="star-s" cx="372" cy="36" r="2"/><circle class="star" cx="430" cy="22" r="2.5"/><circle class="star-b" cx="458" cy="58" r="1.5"/>
  <circle class="star" cx="396" cy="78" r="1.5"/><circle class="star-s" cx="452" cy="104" r="2"/><circle class="star" cx="236" cy="66" r="1.5"/>
  <circle class="star-s" cx="294" cy="86" r="1.5"/><circle class="star" cx="344" cy="58" r="2"/><circle class="star-b" cx="414" cy="126" r="2"/>
  <circle class="star" cx="470" cy="140" r="1.5"/><circle class="star" cx="300" cy="128" r="2"/>
</g>
<rect class="line" x="44" y="60" width="160" height="176" rx="6"/>
<rect class="butter pen" x="40" y="56" width="160" height="176" rx="6"/>
<rect class="line" x="228" y="156" width="112" height="80" rx="6"/>
<rect class="mint pen" x="224" y="152" width="112" height="80" rx="6"/>
<rect class="line" x="368" y="140" width="116" height="152" rx="6"/>
<rect class="peach pen" x="364" y="136" width="120" height="156" rx="6"/>
<rect class="line" x="68" y="260" width="136" height="24" rx="6"/>
<rect class="lilac pen" x="64" y="256" width="136" height="24" rx="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Kaleem</h1>
<p class="tag">Liberate your data. Everything stays yours.</p>
</div>
</div>
</body>
</html>
